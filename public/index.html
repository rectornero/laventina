<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Laventina</title>
<meta name="description" content="Artache Laventina: your household butler. It tells you what matters, catches what would slip away, and keeps the rest out of sight.">
<meta name="theme-color" content="#F7F4FC">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Laventina">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/butler.css">
<script src="/js/butler.js" defer></script>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <span class="sprig" aria-hidden="true"></span>
    <div class="who"><h1>Laventina</h1><small id="status">At your service</small></div>
    <a class="round" href="/rooms.html" title="The butler's rooms" aria-label="The butler's rooms"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 21V4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21M4 21h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="14.5" cy="12.5" r="1.1" fill="currentColor"/></svg></a>
    <button class="round" id="menu-btn" type="button" aria-label="Menu" aria-haspopup="dialog"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg></button>
  </div>
</header>
<main id="feed" aria-live="polite"></main>
<footer class="dock" id="dock" hidden>
  <div class="quick" id="quick" aria-label="Quick replies"></div>
  <form class="composer" id="composer" autocomplete="off">
    <button class="round soft" type="button" id="cam-btn" aria-label="Show me a photo" title="Show me a photo"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.3-2h6.4l1.3 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <input type="file" id="cam" accept="image/*" capture="environment" hidden>
    <label class="sr" for="say">Tell Laventina</label>
    <textarea id="say" rows="1" placeholder="Tell me anything…" enterkeyhint="send"></textarea>
    <button class="round soft" type="button" id="mic-btn" aria-label="Speak" title="Speak" hidden><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <button class="round send" type="submit" id="send-btn" aria-label="Send"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </form>
</footer>
<div id="layer"></div>
</body>
</html>
