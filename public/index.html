<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laventina</title>
<meta name="description" content="A light task manager for the home: one shared list, with inventory, upkeep, projects, and money and papers around it.">
<meta name="theme-color" content="#F7F4FC">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Laventina">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/styles.css">
<script src="/js/base.js" defer></script>
<script src="/js/tasks.js" defer></script>
<script src="/js/house.js" defer></script>
<script src="/js/modules.js" defer></script>
<script src="/js/together.js" defer></script>
<script src="/js/insights.js" defer></script>
<script src="/js/home.js" defer></script>
<script src="/js/expiry-core.js" type="module"></script>
<script src="/js/expiry.js" defer></script>
<script src="/js/brief.js" defer></script>
<script src="/js/app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <span id="brand-logo" class="brand-logo"></span>
      <div class="brand"><h1>Laventina</h1><small id="h-sub"></small></div>
      <span class="members-head" id="h-members"></span>
      <button class="iconbtn bellbtn" data-act="bell" aria-label="House bell" title="House bell"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v3.6l-1.6 2.7A1 1 0 0 0 5.3 17h13.4a1 1 0 0 0 .9-1.7L18 12.6V9a6 6 0 0 0-6-6Z" fill="currentColor"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></button>
      <button class="iconbtn" data-act="settings" aria-label="Settings">Settings</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
  <div class="wrap"><nav class="chips subtabs" id="subtabs" aria-label="House" hidden></nav></div>
</header>
<main class="wrap" id="main"></main>
<button class="fab" data-act="task-new" id="fab" hidden><span aria-hidden="true">+</span> New task</button>
<div id="layer"></div>
<div id="toast-host" aria-live="polite"></div>
</body>
</html>
